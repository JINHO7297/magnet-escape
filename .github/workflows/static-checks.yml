name: Project integrity

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate assets, references and sprite imports
        run: python Tools/validate_project.py
      - name: Exercise project integrity regressions
        run: python -m unittest discover -s Tools/tests -v
      - name: Check patch formatting
        run: git show --format= --check HEAD
